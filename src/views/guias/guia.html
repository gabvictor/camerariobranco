    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Tipografia do artigo: própria, para não depender do que o Tailwind compilou */
        .guia { --g-text: #1f2937; --g-muted: #6b7280; --g-line: #e5e7eb; --g-soft: #f3f4f6; --g-link: #4f46e5; --g-note-bg: #eef2ff; --g-note-line: #c7d2fe; }
        .dark .guia { --g-text: #e5e7eb; --g-muted: #9ca3af; --g-line: #374151; --g-soft: #1f2937; --g-link: #a5b4fc; --g-note-bg: #1e1b4b66; --g-note-line: #4338ca; }
        .guia { color: var(--g-text); font-size: 1.0625rem; line-height: 1.8; }
        .guia h1 { font-size: clamp(1.75rem, 4vw, 2.5rem); line-height: 1.2; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 1rem; }
        .guia h2 { font-size: 1.5rem; line-height: 1.3; font-weight: 700; margin: 2.5rem 0 0.75rem; scroll-margin-top: 5rem; }
        .guia p { margin: 0 0 1.1rem; }
        .guia .lead { font-size: 1.2rem; line-height: 1.7; color: var(--g-muted); }
        .guia ul { margin: 0 0 1.25rem; padding-left: 1.4rem; list-style: disc; }
        .guia li { margin: 0 0 0.5rem; }
        .guia a { color: var(--g-link); text-decoration: underline; text-underline-offset: 3px; }
        .guia table { width: 100%; border-collapse: collapse; margin: 1rem 0 1.25rem; font-size: 0.97rem; line-height: 1.5; }
        .guia th, .guia td { text-align: left; padding: 0.65rem 0.8rem; border-bottom: 1px solid var(--g-line); vertical-align: top; }
        .guia th { background: var(--g-soft); font-weight: 700; }
        .guia .table-wrap { overflow-x: auto; }
        .guia .nota { background: var(--g-note-bg); border: 1px solid var(--g-note-line); border-radius: 0.75rem; padding: 0.8rem 1rem; font-size: 0.95rem; line-height: 1.6; margin: 0 0 1.25rem; }
        .guia .meta { color: var(--g-muted); font-size: 0.9rem; margin: 0 0 1.5rem; }
        .guia .sumario { background: var(--g-soft); border-radius: 0.75rem; padding: 1rem 1.25rem; margin: 0 0 1.5rem; font-size: 0.98rem; line-height: 1.6; }
        .guia .sumario ol { margin: 0.4rem 0 0; padding-left: 1.3rem; list-style: decimal; }
        .guia .cards { display: grid; gap: 0.9rem; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); margin: 1rem 0 0; }
        .guia .card { display: block; border: 1px solid var(--g-line); border-radius: 0.9rem; padding: 1rem 1.1rem; text-decoration: none; color: var(--g-text); background: var(--g-soft); }
        .guia .card strong { display: block; font-size: 1.05rem; margin-bottom: 0.35rem; color: var(--g-link); }
        .guia .card span { display: block; font-size: 0.93rem; line-height: 1.55; color: var(--g-muted); }
        .guia details { border: 1px solid var(--g-line); border-radius: 0.75rem; padding: 0.8rem 1rem; margin: 0 0 0.7rem; }
        .guia summary { cursor: pointer; font-weight: 700; line-height: 1.5; }
        .guia details p { margin: 0.7rem 0 0; }
        .guia .rel { margin-top: 2.5rem; border-top: 1px solid var(--g-line); padding-top: 1.5rem; }
    </style>
</head>
