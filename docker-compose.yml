services:
  camrb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: camrb-server
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    env_file:
      - path: .env
        required: false
    environment:
      - TZ=America/Rio_Branco
      - NODE_ENV=production
      - PORT=3001
      - SITE_DOMAIN=${SITE_DOMAIN:-camerasriobranco.com.br}
      - SITE_BASE_URL=${SITE_BASE_URL:-https://camerasriobranco.com.br}
      - SCANNER_SOURCE=${SCANNER_SOURCE:-prefeitura}
      - FIREBASE_STORAGE_BUCKET=${FIREBASE_STORAGE_BUCKET:-camerasriobranco.firebasestorage.app}
    volumes:
      # Persiste as fotos do timelapse gravadas no disco do host
      - ./public/timelapse:/app/public/timelapse
      # Persiste logos e uploads de patrocinadores no disco do host
      - ./public/uploads:/app/public/uploads
      # Monta a credencial do Firebase de forma segura (somente leitura)
      - ./serviceAccountKey.json:/app/serviceAccountKey.json:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

